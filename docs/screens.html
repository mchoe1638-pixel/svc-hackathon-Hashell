<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 원본: https://claude.ai/artifact/M4e7PwiN1VuphYthP4UXYn (2026-11-02 저장). 화면 흐름 참고용, PLAN이 우선. 요약은 docs/SCREENS.md -->
<title>hashell 화면 플로우</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 왼쪽 화면 목록·보는 사람·설명, 오른쪽 폰 프레임. 좁으면 세로로 쌓임 */
:root{
  --bg:#eef0f3; --panel:#ffffff; --fg:#1b2027; --muted:#5d6672; --line:#d6dbe2;
  --accent:#2f5bd3; --accent-fg:#ffffff; --soft:#e4eafb; --warn:#9a5200; --warn-bg:#fff2dd; --ok:#1f7a4d; --bad:#b3261e;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171c; --panel:#1d2128; --fg:#e7eaef; --muted:#9aa3ae; --line:#323843;
  --accent:#7d9cff; --accent-fg:#0d1220; --soft:#25304d; --warn:#f0b35c; --warn-bg:#3a2c16; --ok:#5fc890; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1d2128; --fg:#e7eaef; --muted:#9aa3ae; --line:#323843;
  --accent:#7d9cff; --accent-fg:#0d1220; --soft:#25304d; --warn:#f0b35c; --warn-bg:#3a2c16; --ok:#5fc890; --bad:#ff8a80; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}.phone{order:-1;position:static}}
h1{font-size:20px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:14px}
.ctrl .lbl{font-size:12px;color:var(--muted)}
.groups{display:grid;gap:12px}
.grp h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.idx{display:flex;flex-wrap:wrap;gap:6px}
.idx button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer}
.idx button[aria-current="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.note{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.note h3{margin:0 0 8px;font-size:15px}
.note dl{display:grid;grid-template-columns:64px minmax(0,1fr);gap:6px 10px;margin:0}
.note dt{color:var(--muted)}
.note dd{margin:0;min-width:0;overflow-wrap:anywhere}
code{font-family:var(--mono);font-size:12px;background:var(--soft);padding:1px 5px;border-radius:4px}
.legend{margin-top:12px;color:var(--muted);font-size:12px}

.phone{background:var(--panel);border:1px solid var(--line);border-radius:22px;height:740px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;position:sticky;top:max(16px,env(safe-area-inset-top,0px))}
.bar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:48px}
.bar .back{border:0;background:none;color:var(--fg);font:inherit;font-size:18px;cursor:pointer;padding:0 6px 0 0}
.bar .t{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}
.url{font-family:var(--mono);font-size:11px;color:var(--muted);padding:4px 14px;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;position:relative}
.foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
.btn{flex:1;font:inherit;font-weight:700;border-radius:10px;padding:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{flex:none;padding:6px 10px;font-size:12px;border-radius:8px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{font-size:18px;font-weight:700;margin:0;text-wrap:balance}
.hint{color:var(--muted);font-size:13px;margin:0}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=number]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--muted);font-size:12px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.list{border:1px solid var(--line);border-radius:10px;padding:0 12px}
.click{cursor:pointer}
.chip{font:inherit;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:transparent;white-space:nowrap}
.chip.on{background:var(--soft);color:var(--accent);border-color:transparent}
.chip.est{color:var(--warn);border-color:var(--warn)}
button.chip{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;font:inherit;padding:8px;border:0;background:transparent;color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px}
.info{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.big{display:grid;place-items:center;gap:4px;border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;background:transparent;color:var(--fg);font:inherit}
.big b{font-size:16px}
.qr{width:120px;height:120px;margin:0 auto;border:1px solid var(--line);border-radius:8px;background:
 repeating-linear-gradient(90deg,var(--fg) 0 6px,transparent 6px 12px),repeating-linear-gradient(0deg,var(--panel) 0 6px,transparent 6px 12px);opacity:.75}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;margin:30px auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.ok{color:var(--ok);font-size:12px;white-space:nowrap}
.tag{font-size:11px;color:var(--muted);font-weight:400}
.toast{position:sticky;bottom:0;margin-top:auto;background:var(--fg);color:var(--panel);border-radius:8px;padding:10px 12px;font-size:13px}
.wr{background:var(--soft);border-radius:14px;padding:18px;display:grid;gap:10px}
.wr .ttl{font-size:22px;font-weight:700;color:var(--accent);text-wrap:balance}
.sumrow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.sumrow.total{font-weight:700;color:var(--fg);font-size:14px}
</style>
</head>
<body>

<div class="wrap">
  <div>
    <h1>hashell 화면 플로우</h1>
    <p class="sub">디자인 없는 설계도. PLAN v3 기준. 버튼을 누르면 다음 화면으로 넘어가요. 숫자와 이름은 모두 예시예요.</p>
    <div class="ctrl">
      <span class="lbl">보는 사람</span>
      <div class="seg" id="seg-viewer" style="min-width:220px"><button data-viewer="명규">명규 · 총무 앱</button><button data-viewer="승화">승화 · 동행 웹</button></div>
      <span class="lbl" id="status-lbl"></span>
    </div>
    <div class="groups" id="index"></div>
    <div class="note" id="note"></div>
    <p class="legend">앱과 웹은 같은 화면이에요. 차이는 총무 전용 버튼(isOrganizer)과 첫 화면(/)뿐. 보는 사람을 바꾸면 버튼·권한이 바뀌어요.</p>
  </div>

  <div class="phone">
    <div class="bar"><button class="back" id="back" aria-label="뒤로">←</button><div class="t" id="title"></div><span class="who" id="who"></span></div>
    <div class="url" id="url"></div>
    <div class="body" id="body"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script>
const ST={me:"명규",status:"OPEN",toast:"",pay:"CASH",recv:{},members:[
 {n:"명규",org:true,bound:true},{n:"승화",bound:true},{n:"지훈",bound:true},{n:"민지",bound:false}]};
const ALL=["명규","승화","지훈"];
const items=[
 {o:"生ビール",k:"생맥주",u:600,q:4,t:"EACH",c:"alcohol",eat:["명규","승화","지훈"]},
 {o:"ハイボール",k:"하이볼",u:550,q:2,t:"EACH",c:"alcohol",eat:["승화"]},
 {o:"お好み焼き",k:"오코노미야키",u:1300,q:2,t:"SHARED",c:"meal",eat:["명규","승화","지훈"]},
 {o:"唐揚げ",k:"가라아게",u:780,q:1,t:"SHARED",c:"snack",eat:["명규","지훈"]},
 {o:"烏龍茶",k:"우롱차",u:300,q:2,t:"EACH",c:"drink",eat:["지훈"]},
 {o:"枝豆",k:"에다마메",u:450,q:1,t:"SHARED",c:"snack",eat:["명규","승화","지훈"]}
];
const expenses=[
 {id:"izakaya",name:"도톤보리 이자카야",payer:"승화",by:"승화",yen:"¥9,260",krw:"₩83,803",pay:"현금",est:false,items:6},
 {id:"ramen",name:"이치란 라멘",payer:"명규",by:"명규",yen:"¥4,280",krw:"₩39,720",pay:"카드",est:true,items:3},
 {id:"conv",name:"패밀리마트",payer:"지훈",by:"지훈",yen:"¥1,850",krw:"₩16,743",pay:"현금",est:false,items:0}
];
const transfers=[{from:"지훈",to:"승화",amt:"₩41,200"},{from:"명규",to:"승화",amt:"₩18,350"}];
const yen=n=>"¥"+n.toLocaleString("ko-KR");
const isOrg=()=>ST.me==="명규";
const settled=()=>ST.status==="SETTLED";
const statusChip=()=>`<span class="chip on">${ST.status}</span>`;

const S={
 "create":{g:"총무 (앱)",t:"여행 만들기",url:"/  (앱으로 열었을 때)",as:"명규",
  note:{목적:"총무가 앱에서 방을 만든다. 방 만들기는 앱에서만.",훅:"<code>useCreateTrip()</code> → tripId, inviteCode",API:"<code>POST /api/trips</code>",메모:"카드 수수료율은 2.2%를 기본값으로 제시하고 총무가 수정. 현금 환율은 환전 영수증 기준. 멤버 이름은 미리 등록, 동행은 참여할 때 이 중에서 고른다."},
  body:()=>`<p class="q">어떤 여행이에요?</p>
   <label class="f">여행 이름<input type="text" id="f-trip" value="오사카 3박 4일"></label>
   <label class="f">현지 통화<input type="text" id="f-cur" value="JPY (엔)"></label>
   <div class="two"><label class="f">현금 환율 (₩ / ¥100)<input type="number" id="f-cash" value="905"></label>
   <label class="f">카드 수수료율 (%)<input type="number" id="f-fee" value="2.2"></label></div>
   <p class="hint">함께 가는 사람</p>
   <div class="chips">${ST.members.map(m=>`<span class="chip on">${m.n}${m.org?" · 나(총무)":""}</span>`).join("")}<button class="chip">+ 이름 추가</button></div>`,
  foot:()=>[["여행 만들기","invite"]]},
 "web-home":{g:"총무 (앱)",t:"hashell",url:"/  (웹 브라우저로 열었을 때)",as:"승화",
  note:{목적:"웹으로 첫 화면에 오면 방 만들기 대신 앱 안내만.",훅:"<code>isNativeApp()</code> (src/lib/native.ts)",메모:"화면 구분일 뿐 서버가 앱 여부를 검증하지는 않는다."},
  body:()=>`<p class="q" style="margin-top:40px;text-align:center">방은 hashell 앱에서 만들 수 있어요</p><p class="hint" style="text-align:center">초대 링크를 받았다면 그 링크로 들어와 주세요</p>`,
  foot:()=>[]},
 "invite":{g:"총무 (앱)",t:"동행 초대",url:"/trip/7kq2/invite",as:"명규",back:"home",
  note:{목적:"링크 공유, 참여 현황 확인, 링크 잠금. 모달이 아니라 독립 화면이라 새로고침해도 유지.",훅:"<code>useTrip</code>, <code>useLockTrip</code>, <code>shareInvite(url)</code>",API:"<code>POST /api/trips</code> (잠금)",메모:"앱이면 폰 기본 공유창, 웹이면 링크 복사. 잠그면 LOCKED: 새 기기 참여 차단, 기존 멤버는 계속 사용. 잠금 버튼은 총무만."},
  body:()=>{const j=ST.members.filter(m=>m.bound).length;return `${statusChip()}
   <p class="q">링크를 단톡방에 보내주세요</p>
   <div class="qr" role="img" aria-label="QR 코드 자리"></div>
   <button class="btn ghost" data-act="share">${isOrg()?"공유하기":"링크 복사"}</button>
   <p class="hint">참여 ${j}/${ST.members.length}명</p>
   <div class="list">${ST.members.map(m=>`<div class="row"><div class="main"><b>${m.n}${m.org?" · 총무":""}</b></div><span class="chip ${m.bound?"on":""}">${m.bound?"참여함":"아직"}</span></div>`).join("")}</div>`},
  foot:()=>isOrg()&&ST.status==="OPEN"?[["링크 잠그기","lock"]]:[["홈으로","home"]]},
 "join":{g:"동행 (웹)",t:"오사카 3박 4일",url:"/j/7KQ2OSAKA9F3M2X",as:"승화",
  note:{목적:"링크로 들어온 동행이 자기 이름을 고른다. 설치·가입 없음.",훅:"<code>useJoinInfo(inviteCode)</code>, <code>useJoinTrip()</code>",API:"익명 로그인 → <code>POST /api/join</code>",메모:"이미 참여한 기기는 바로 홈. 다른 기기와 묶인 이름은 선택 불가(409). 새 이름 추가는 OPEN일 때만. 잠김+미참여 기기는 참여 마감 화면."},
  body:()=>`<p class="q">누구세요?</p><p class="hint">명규님이 만든 여행이에요</p>
   <div class="list">${ST.members.map(m=>m.bound&&m.n!=="승화"?`<div class="row"><div class="main"><b>${m.n}</b></div><span class="chip">다른 기기에서 참여함</span></div>`:`<div class="row click" data-go="home"><div class="main"><b>${m.n}</b></div><span class="chip on">나예요</span></div>`).join("")}</div>
   <label class="f">목록에 없어요<input type="text" id="f-new" placeholder="내 이름"></label>`,
  foot:()=>[["새 이름으로 참여","home"]]},
 "join-closed":{g:"동행 (웹)",t:"오사카 3박 4일",url:"/j/7KQ2OSAKA9F3M2X",as:"승화",
  note:{목적:"링크가 잠긴 뒤 새 기기로 들어온 경우.",훅:"<code>useJoinInfo</code>의 잠김 여부",메모:"재연결(폰 분실 복구)은 범위 밖. 총무에게 문의하라고만 안내."},
  body:()=>`<p class="q" style="margin-top:40px;text-align:center">참여가 마감됐어요</p><p class="hint" style="text-align:center">총무가 링크를 잠갔어요. 참여해야 한다면 총무에게 말해 주세요.</p>`,
  foot:()=>[]},
 "home":{g:"함께",t:"오사카 3박 4일",url:"/trip/7kq2",
  note:{목적:"여행의 메인. 내 받을 돈/보낼 돈과 지출 목록.",훅:"<code>useTrip</code>, <code>useExpenses</code>, <code>useSettlement</code> (실시간 자동 구독)",메모:"미참여자가 있으면 상단 배너 → 초대 화면. 카드 결제는 '추정' 배지(isEstimated). SETTLED면 지출 추가 버튼 숨김."},
  body:()=>{const unj=ST.members.filter(m=>!m.bound).length;const recv=ST.me==="승화";return `
   ${unj&&ST.status==="OPEN"?`<div class="info click" data-go="invite">${unj}명이 아직 안 들어왔어요 · 초대 화면 열기</div>`:""}
   ${settled()?`<div class="info">정산이 확정됐어요. 이제 수정할 수 없어요.</div>`:""}
   <div class="cards"><div class="card"><div class="meta">받을 돈</div><div class="v">${recv?"₩59,550":"₩0"}</div></div><div class="card"><div class="meta">보낼 돈</div><div class="v">${recv?"₩0":"₩18,350"}</div></div></div>
   <div class="list">${expenses.map(e=>`<div class="row click" data-go="expense"><div class="main"><b>${e.name}</b><span class="meta">${e.payer} · ${e.pay}${e.items?` · 품목 ${e.items}개`:" · 품목 없음"}</span></div><div class="num">${e.yen}<div class="meta">${e.krw}</div></div>${e.est?'<span class="chip est">추정</span>':""}</div>`).join("")}</div>`},
  foot:()=>settled()?[["정산 보기","settled"]]:[["정산 보기","settle","ghost"],["지출 추가","new"]]},
 "new":{g:"지출 추가",t:"지출 추가",url:"/trip/7kq2/expense/new",back:"home",
  note:{목적:"입력 방법 선택. 누구나 지출을 올릴 수 있다.",훅:"<code>useParseReceipt()</code>, <code>resize.ts</code>",메모:"촬영 전 브라우저에서 긴 변 1500px로 줄인다. 앱에서 촬영이 안 열리면 갤러리 선택으로 대체."},
  body:()=>`<p class="q">어떻게 추가할까요?</p>
   <button class="big" data-go="parsing"><b>영수증 찍기</b><span class="hint">품목까지 자동으로 읽어요</span></button>
   <button class="big" data-go="manual"><b>직접 입력</b><span class="hint">품목 없는 영수증·카드 전표</span></button>`,
  foot:()=>[]},
 "parsing":{g:"지출 추가",t:"영수증 읽는 중",url:"/trip/7kq2/expense/new",back:"new",
  note:{목적:"AI가 읽는 동안 대기.",API:"<code>POST /api/parse-receipt</code> (이미지 저장 안 함)",메모:"판독 실패나 쿼터 초과면 수기 입력으로 넘긴다. 결과는 초안이라 아직 저장되지 않는다."},
  body:()=>`<div class="spin" role="status" aria-label="읽는 중"></div><p class="q" style="text-align:center">영수증을 읽고 있어요</p><p class="hint" style="text-align:center">보통 5초 안에 끝나요</p>`,
  foot:()=>[["결과: 정상 (데모)","review","ghost"],["결과: 확인 필요 (데모)","review-check"]]},
 "review":{g:"지출 추가",t:"읽은 내용 확인",url:"/trip/7kq2/expense/new",back:"new",review:false,
  note:{목적:"AI 초안을 확인하고 결제 정보를 고른 뒤 저장.",훅:"<code>useCreateExpense()</code>",API:"<code>POST /api/expenses</code> (환율·수수료 스냅샷)",메모:"저장하면 품목은 전원 체크 상태로 시작. 현금은 방의 환전 환율로 확정, 카드는 TTS×(1+수수료)로 추정. category는 Wrapped용(화면엔 안 보여도 됨)."},
  body:()=>reviewBody(false),foot:()=>[["저장","expense"]]},
 "review-check":{g:"지출 추가",t:"직접 확인해 주세요",url:"/trip/7kq2/expense/new",back:"new",
  note:{목적:"수동 확인 화면. 합계가 안 맞거나 confidence: low일 때.",훅:"<code>needsReview: true</code>",메모:"틀린 금액을 자신 있게 보여주는 게 제일 치명적. 경고를 맨 위에, 수정 가능한 상태로."},
  body:()=>reviewBody(true),foot:()=>[["고쳐서 저장","expense"]]},
 "manual":{g:"지출 추가",t:"직접 입력",url:"/trip/7kq2/expense/new",back:"new",
  note:{목적:"품목 없는 영수증·카드 전표.",훅:"<code>useCreateExpense()</code>",메모:"예외 항목만 입력하면 나머지는 체크된 인원끼리 자동 분배. 예: ¥1,850 중 지훈 혼자 산 ¥400 → 남은 ¥1,450을 셋이 나눔."},
  body:()=>`<label class="f">어디서 썼어요?<input type="text" id="f-where" value="패밀리마트"></label>
   <label class="f">총액 (엔)<input type="number" id="f-amt" value="1850"></label>
   <p class="hint">한 사람만 해당되는 항목 (선택)</p>
   <div class="list"><div class="row"><div class="main"><b>맥주</b><span class="meta">지훈</span></div><div class="num">¥400</div></div></div>
   <button class="chip">+ 항목 추가</button>
   <p class="hint">누가 냈어요?</p>${payerSeg("지훈")}
   <p class="hint">어떻게 냈어요?</p>${paySeg()}`,
  foot:()=>[["저장","home"]]},
 "expense":{g:"함께",t:"도톤보리 이자카야",url:"/trip/7kq2/expense/izakaya",back:"home",
  note:{목적:"품목 체크 + 수정·삭제. 정산 정확도의 핵심 화면.",훅:"<code>useExpense(id)</code>, <code>useToggleShare()</code>, <code>useUpdateExpense/useDeleteExpense</code>",메모:"품목은 전원 체크로 시작. 안 먹은 사람이 자기 체크만 해제(총무는 대신 가능). 마지막 1명은 해제 불가. 수정·삭제 버튼은 canEdit일 때만. SETTLED면 전부 읽기 전용(423)."},
  body:()=>`<p class="hint">안 먹은 메뉴에서 내 이름을 눌러 빼주세요</p>
   <div class="list">${items.map((i,k)=>`<div class="row" style="align-items:flex-start"><div class="main"><b>${i.k} ×${i.q}</b><span class="meta">${i.o} · ${i.t==="EACH"?"1인 1개":"나눠 먹음"}</span>
     <div class="chips">${ALL.map(n=>{const on=i.eat.includes(n);const mine=n===ST.me;return `<button class="chip ${on?"on":""}" data-toggle="${k}" data-who="${n}" ${mine?'style="font-weight:700"':""}>${on?"✓ ":""}${n}</button>`}).join("")}</div></div><div class="num">${yen(i.u*i.q)}</div></div>`).join("")}</div>
   <div class="sumrow"><span>세금</span><span class="num">¥0 (내세)</span></div>
   <div class="sumrow total"><span>합계 · 승화가 현금</span><span class="num">¥9,260 · ₩83,803</span></div>
   ${ST.toast?`<div class="toast" role="status">${ST.toast}</div>`:""}`,
  foot:()=>{if(settled())return [];const can=isOrg()||ST.me==="승화";return can?[["삭제","home","danger"],["수정","conflict","ghost"]]:[]}},
 "conflict":{g:"함께",t:"도톤보리 이자카야",url:"/trip/7kq2/expense/izakaya",back:"expense",
  note:{목적:"동시 수정 충돌 (409).",훅:"<code>useUpdateExpense()</code>의 409 에러",메모:"요청에 version을 실어 보냄. 다르면 늦은 쪽을 막고 최신 내용을 다시 보여준다."},
  body:()=>`<div class="warn">다른 사람이 먼저 이 지출을 고쳤어요. 최신 내용을 불러왔으니 확인하고 다시 고쳐주세요.</div>
   <div class="list"><div class="row"><div class="main"><b>낸 사람</b></div><div>승화 → <b>명규</b></div></div><div class="row"><div class="main"><b>고친 사람</b></div><div>명규 · 방금</div></div></div>`,
  foot:()=>[["최신 내용 보기","expense"]]},
 "settle":{g:"정산",t:"정산",url:"/trip/7kq2/settle",back:"home",
  note:{목적:"확정 전 정산 미리보기. 체크가 바뀌면 실시간으로 바뀐다.",훅:"<code>useSettlement</code>, <code>useSettleTrip()</code>",API:"<code>POST /api/trips</code> (확정)",메모:"송금은 최대 (인원−1)번. 확정은 총무만. 확정하면 송금 목록 고정, 이후 쓰기 423."},
  body:()=>`<p class="q">송금 ${transfers.length}번이면 끝나요</p>
   <div class="list">${transfers.map(t=>`<div class="row"><div class="main"><b>${t.from} → ${t.to}</b></div><div class="num">${t.amt}</div></div>`).join("")}</div>
   <p class="hint">각자 쓴 돈 (원화)</p>
   <div class="list">
    <div class="row"><div class="main"><b>명규</b><span class="meta">낸 돈 ₩39,720</span></div><div class="num">₩46,850</div></div>
    <div class="row"><div class="main"><b>승화</b><span class="meta">낸 돈 ₩83,803</span></div><div class="num">₩41,100</div></div>
    <div class="row"><div class="main"><b>지훈</b><span class="meta">낸 돈 ₩16,743</span></div><div class="num">₩52,316</div></div></div>
   <p class="hint">카드 결제 1건은 추정 환율이에요.</p>
   ${isOrg()?"":`<div class="info">총무가 확정하면 송금 목록이 고정돼요.</div>`}`,
  foot:()=>isOrg()?[["정산 확정","do-settle"]]:[]},
 "settled":{g:"정산",t:"정산 확정됨",url:"/trip/7kq2/settle",back:"home",
  note:{목적:"고정된 송금 목록. 받은 사람이 '받았어요'.",훅:"<code>useSettlement</code>(확정 후), <code>useMarkReceived()</code>, <code>useUnsettleTrip()</code>",API:"<code>POST /api/transfers</code>",메모:"'받았어요'는 받는 사람(isMeReceiver)만. 각 줄에 계좌 복사·송금 앱 버튼. 확정 해제는 총무만."},
  body:()=>`${statusChip()}<div class="list">${transfers.map((t,k)=>{const done=ST.recv[k];const me=t.to===ST.me;return `<div class="row"><div class="main"><b>${t.from} → ${t.to}</b><span class="meta">${t.to} 계좌 복사</span></div><div class="num">${t.amt}</div>${done?'<span class="ok">받음</span>':me?`<button class="btn sm" data-recv="${k}">받았어요</button>`:'<span class="meta">대기</span>'}</div>`}).join("")}</div>
   ${Object.keys(ST.recv).length===transfers.length?`<div class="info">모두 받았어요. 정산 끝!</div>`:""}`,
  foot:()=>{const f=[["여행 돌아보기","wrapped","ghost"]];if(isOrg())f.unshift(["확정 해제","unsettle","danger"]);return f}},
 "unsettle":{g:"정산",t:"확정 해제",url:"/trip/7kq2/settle",back:"settled",
  note:{목적:"잘못 확정했을 때 총무가 되돌린다.",훅:"<code>useUnsettleTrip()</code>",메모:"SETTLED → LOCKED, transfers 삭제. 경고 후 실행. alert/confirm 대신 화면 안에서 확인."},
  body:()=>`<p class="q">확정을 해제할까요?</p><div class="warn">송금 기록과 '받았어요' 표시가 모두 초기화돼요.</div>`,
  foot:()=>[["취소","settled","ghost"],["해제하기","do-unsettle"]]},
 "wrapped":{g:"선택 기능",t:"여행 돌아보기",url:"/trip/7kq2/wrapped",back:"settled",
  note:{목적:"공유하고 싶은 여행 결산 카드. 선택 기능(시간 남을 때만).",훅:"(미정) <code>useWrapped(tripId)</code>",API:"wrapped 조회 (경로 미정)",메모:"칭호는 Claude가 한 번만 만들어 trips.wrapped_title에 저장. 통계는 items.category + item_shares로 집계."},
  body:()=>`<div class="wr"><span class="tag">오사카 3박 4일</span><div class="ttl">이자카야 정복대</div>
   <div class="list" style="background:var(--panel)">
    <div class="row"><div class="main"><b>총 지출</b></div><div class="num">₩140,266</div></div>
    <div class="row"><div class="main"><b>가장 비싼 한 끼</b></div><div>도톤보리 이자카야</div></div>
    <div class="row"><div class="main"><b>맥주왕</b></div><div>승화</div></div>
    <div class="row"><div class="main"><b>지출 건수</b></div><div class="num">3건</div></div></div></div>`,
  foot:()=>[]}
};
function payerSeg(sel){return `<div class="seg">${ALL.map(n=>`<button data-payer aria-pressed="${n===sel}">${n}</button>`).join("")}</div>`}
function paySeg(){return `<div class="seg"><button data-pay="CASH" aria-pressed="${ST.pay==="CASH"}">현금</button><button data-pay="CARD" aria-pressed="${ST.pay==="CARD"}">해외 카드</button></div>
  <p class="hint">${ST.pay==="CASH"?"환전 환율로 확정: ₩905 / ¥100":"오늘 TTS × (1 + 2.2%)로 추정해요. '추정' 배지가 붙어요"}</p>`}
function reviewBody(chk){return `${chk?`<div class="warn">품목 합계(¥9,260)가 영수증 합계(¥9,560)와 ¥300 달라요. 빠진 품목이 있는지 확인해 주세요.</div>`:""}
  <div class="list">${items.map(i=>`<div class="row"><div class="main"><b>${i.k} ×${i.q}</b><span class="meta">${i.o} · ${i.t==="EACH"?"1인 1개":"나눠 먹음"} · ${i.c}</span></div><div class="num">${yen(i.u*i.q)}</div></div>`).join("")}${chk?`<div class="row"><div class="main"><b class="meta">+ 품목 추가</b></div></div>`:""}</div>
  <div class="sumrow"><span>소계</span><span class="num">¥9,260</span></div>
  <div class="sumrow"><span>세금·봉사료·할인</span><span class="num">¥0</span></div>
  <div class="sumrow total"><span>합계</span><span class="num">${chk?"¥9,560":"¥9,260"}</span></div>
  <p class="hint">누가 냈어요?</p>${payerSeg("승화")}
  <p class="hint">어떻게 냈어요?</p>${paySeg()}`}

const order=Object.keys(S);let cur="create";
function go(id){
 if(id==="lock"){ST.status="LOCKED";id="invite"}
 if(id==="do-settle"){ST.status="SETTLED";id="settled"}
 if(id==="do-unsettle"){ST.status="LOCKED";ST.recv={};id="settle"}
 if(id==="settle"&&settled())id="settled";
 if(!S[id])id="create";
 if(S[id].as)ST.me=S[id].as;
 ST.toast="";cur=id;try{history.replaceState(null,"","#"+id)}catch(e){}render();
}
function render(){
 const s=S[cur];
 document.getElementById("title").textContent=s.t;
 document.getElementById("who").textContent=isOrg()?"명규 · 총무 앱":"승화 · 동행 웹";
 document.getElementById("url").textContent=s.url;
 document.getElementById("status-lbl").textContent="여행 상태: "+ST.status;
 document.querySelectorAll("#seg-viewer button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.viewer===ST.me));
 const b=document.getElementById("back");b.hidden=!s.back;b.onclick=()=>go(s.back);
 document.getElementById("body").innerHTML=s.body();
 const fs=s.foot(),f=document.getElementById("foot");f.hidden=!fs.length;
 f.innerHTML=fs.map(([l,to,c])=>`<button class="btn ${c||""}" data-go="${to}">${l}</button>`).join("");
 document.getElementById("note").innerHTML=`<h3>${s.t} <span class="tag">#${cur}</span></h3><dl>${Object.entries(s.note).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
 const groups={};order.forEach(k=>(groups[S[k].g]=groups[S[k].g]||[]).push(k));
 document.getElementById("index").innerHTML=Object.entries(groups).map(([g,ks])=>`<div class="grp"><h2>${g}</h2><div class="idx">${ks.map(k=>`<button data-go="${k}" aria-current="${k===cur}">${S[k].t}</button>`).join("")}</div></div>`).join("");
}
function toast(m){ST.toast=m;render()}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-go],[data-toggle],[data-pay],[data-act],[data-recv],[data-viewer],[data-payer]");if(!t)return;
 if(t.dataset.viewer){ST.me=t.dataset.viewer;ST.toast="";render();return}
 if(t.dataset.go){go(t.dataset.go);return}
 if(t.dataset.toggle){
  if(settled())return toast("정산이 확정돼 수정할 수 없어요");
  const i=items[+t.dataset.toggle],who=t.dataset.who,k=i.eat.indexOf(who);
  if(who!==ST.me&&!isOrg())return toast("다른 사람 체크는 총무만 바꿀 수 있어요");
  if(k>=0&&i.eat.length===1)return toast("한 명은 먹었어야 해요. 마지막 체크는 뺄 수 없어요");
  k<0?i.eat.push(who):i.eat.splice(k,1);ST.toast="";render();return}
 if(t.dataset.pay){ST.pay=t.dataset.pay;render();return}
 if(t.hasAttribute("data-payer")){t.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===t));return}
 if(t.dataset.recv){ST.recv[t.dataset.recv]=true;render();return}
 if(t.dataset.act==="share"){const u="https://hashell.vercel.app/j/7KQ2OSAKA9F3M2X";try{navigator.clipboard.writeText(u).catch(()=>{})}catch(_){}t.textContent=isOrg()?"공유창을 열었어요 (앱)":"링크를 복사했어요";}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==cur&&S[h])go(h)});
go(location.hash.slice(1)||"create");
</script>

</body></html>
