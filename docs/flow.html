<script id="app">
(function(){
'use strict';
var ROOT_HTML = document.getElementById('root').outerHTML; // pristine markup, captured before any render
var DATA = JSON.parse(document.getElementById('flow-data').textContent);
var S = {lanes:DATA.lanes, nodes:DATA.nodes, edges:DATA.edges};
var SAVED = JSON.stringify(S);
var DRAFT_KEY = 'hashell-board-draft';
var TYPES = {screen:{n:'화면',w:200},decision:{n:'분기',w:190},server:{n:'서버',w:200},live:{n:'실시간',w:200},terminal:{n:'시작·끝',w:180},planned:{n:'예정',w:200},note:{n:'메모',w:190}};
var $ = function(id){return document.getElementById(id);};
var vp = $('vp'), world = $('world'), nodesEl = $('nodes'), edgesEl = $('edges'), labelsEl = $('labels'), lanesEl = $('lanes'), insp = $('insp');
var view = {x:0,y:0,z:1};
var sel = null;            // {kind:'node'|'edge', id}
var sizes = {};            // id -> {w,h}
var undo = [], redo = [];
var editing = null;        // node id being edited
var artifactCap = null, canWrite = false;

try{ var d = JSON.parse(localStorage.getItem(DRAFT_KEY)||'null'); if(d && d.base === (DATA.updatedAt||'') && d.json && d.json !== SAVED){ S = JSON.parse(d.json); setTimeout(function(){toast('저장 안 한 편집 내용을 이어서 보여드려요');},300);} }catch(e){}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function uid(p){return p+Math.random().toString(36).slice(2,8);}
function node(id){for(var i=0;i<S.nodes.length;i++) if(S.nodes[i].id===id) return S.nodes[i]; return null;}
function edge(id){for(var i=0;i<S.edges.length;i++) if(S.edges[i].id===id) return S.edges[i]; return null;}
function rect(n){var s = sizes[n.id]||{w:n.w,h:56}; return {x:n.x,y:n.y,w:s.w,h:s.h};}

/* ---------- history ---------- */
function snap(){ undo.push(JSON.stringify(S)); if(undo.length>120) undo.shift(); redo = []; }
function changed(){
  renderAll(); status();
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({base:DATA.updatedAt||'', json:JSON.stringify(S)})); }catch(e){}
}
function doUndo(){ if(!undo.length) return; redo.push(JSON.stringify(S)); S = JSON.parse(undo.pop()); sel = null; changed(); }
function doRedo(){ if(!redo.length) return; undo.push(JSON.stringify(S)); S = JSON.parse(redo.pop()); sel = null; changed(); }

/* ---------- view ---------- */
function applyView(){
  world.style.transform = 'translate('+view.x+'px,'+view.y+'px) scale('+view.z+')';
  var g = 20*view.z; vp.style.backgroundSize = g+'px '+g+'px'; vp.style.backgroundPosition = view.x+'px '+view.y+'px';
  $('zVal').textContent = Math.round(view.z*100)+'%';
}
function toWorld(cx,cy){ var r = vp.getBoundingClientRect(); return {x:(cx-r.left-view.x)/view.z, y:(cy-r.top-view.y)/view.z}; }
function zoomAt(f,cx,cy){
  var r = vp.getBoundingClientRect(); var px = cx-r.left, py = cy-r.top;
  var nz = Math.max(0.2, Math.min(2.5, view.z*f)); f = nz/view.z;
  view.x = px-(px-view.x)*f; view.y = py-(py-view.y)*f; view.z = nz; applyView();
}
function bounds(){
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  S.nodes.forEach(function(n){var r=rect(n);minX=Math.min(minX,r.x);minY=Math.min(minY,r.y);maxX=Math.max(maxX,r.x+r.w);maxY=Math.max(maxY,r.y+r.h);});
  S.lanes.forEach(function(l){minX=Math.min(minX,l.x);maxX=Math.max(maxX,l.x+l.w);});
  if(minX===Infinity){minX=0;minY=0;maxX=400;maxY=400;}
  return {x:minX,y:Math.min(minY,0),w:maxX-minX,h:maxY-Math.min(minY,0)};
}
function fitAll(){
  var b = bounds(), r = vp.getBoundingClientRect();
  view.z = Math.max(0.2, Math.min(1.2, (r.width-48)/(b.w+40), (r.height-48)/(b.h+120)));
  view.x = (r.width - b.w*view.z)/2 - b.x*view.z; view.y = 24 - (b.y-20)*view.z; applyView();
}
function fitWidth(){
  var b = bounds(), r = vp.getBoundingClientRect();
  if(r.width < 640){ view.z = 0.62; view.x = 12 - b.x*view.z; view.y = 12 - (b.y-10)*view.z; applyView(); return; }
  view.z = Math.max(0.3, Math.min(1, (r.width-32)/(b.w+40)));
  view.x = (r.width - b.w*view.z)/2 - b.x*view.z; view.y = 16 - (b.y-10)*view.z; applyView();
}

/* ---------- render ---------- */
function laneExtent(){ var b = bounds(); return {top:-10, bottom:b.y+b.h+80}; }
function renderLanes(){
  var e = laneExtent();
  lanesEl.innerHTML = S.lanes.map(function(l){
    return '<div class="lane" style="left:'+l.x+'px;top:'+e.top+'px;width:'+l.w+'px;height:'+(e.bottom-e.top)+'px"><div class="lane-t"><b>'+esc(l.title)+'</b><small>'+esc(l.sub||'')+'</small></div></div>';
  }).join('');
}
function renderNodes(){
  nodesEl.innerHTML = S.nodes.map(function(n){
    var on = sel && sel.kind==='node' && sel.id===n.id;
    return '<div class="node t-'+n.type+(on?' sel':'')+'" data-id="'+n.id+'" style="left:'+n.x+'px;top:'+n.y+'px;width:'+n.w+'px"><div class="txt">'+esc(n.text)+'</div>'+
      (on?'<span class="h n" data-side="n"></span><span class="h e" data-side="e"></span><span class="h s" data-side="s"></span><span class="h w" data-side="w"></span>':'')+'</div>';
  }).join('');
  measure();
}
function measure(){ nodesEl.querySelectorAll('.node').forEach(function(el){ sizes[el.dataset.id] = {w:el.offsetWidth, h:el.offsetHeight}; }); }
function port(r,s){ return s==='n'?[r.x+r.w/2,r.y]:s==='s'?[r.x+r.w/2,r.y+r.h]:s==='e'?[r.x+r.w,r.y+r.h/2]:[r.x,r.y+r.h/2]; }
var NORM = {n:[0,-1],s:[0,1],e:[1,0],w:[-1,0]};
function sides(a,b){
  var dx = (b.x+b.w/2)-(a.x+a.w/2), dy = (b.y+b.h/2)-(a.y+a.h/2);
  var gapX = Math.max(b.x-(a.x+a.w), a.x-(b.x+b.w)), gapY = Math.max(b.y-(a.y+a.h), a.y-(b.y+b.h));
  if(gapY > 10 && (gapX < 20 || Math.abs(dy) > Math.abs(dx)*0.6)) return dy>0?['s','n']:['n','s'];
  return dx>0?['e','w']:['w','e'];
}
function curve(p1,s1,p2,s2){
  var dist = Math.hypot(p2[0]-p1[0],p2[1]-p1[1]), off = Math.max(28, Math.min(110, dist/2.2));
  var c1 = [p1[0]+NORM[s1][0]*off, p1[1]+NORM[s1][1]*off];
  var c2 = s2 ? [p2[0]+NORM[s2][0]*off, p2[1]+NORM[s2][1]*off] : p2;
  return {d:'M'+p1[0]+','+p1[1]+' C'+c1[0]+','+c1[1]+' '+c2[0]+','+c2[1]+' '+p2[0]+','+p2[1],
    mid:[(p1[0]+3*c1[0]+3*c2[0]+p2[0])/8,(p1[1]+3*c1[1]+3*c2[1]+p2[1])/8]};
}
var temp = null; // connecting line {from, side, x, y}
function renderEdges(){
  var e = laneExtent(), b = bounds();
  var minX = b.x-300, minY = e.top-300, W = b.w+600, H = e.bottom-e.top+600;
  edgesEl.setAttribute('viewBox', minX+' '+minY+' '+W+' '+H);
  edgesEl.style.left = minX+'px'; edgesEl.style.top = minY+'px'; edgesEl.style.width = W+'px'; edgesEl.style.height = H+'px';
  var out = '<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>'+
    '<marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk sel" d="M0,0 L10,5 L0,10 z"/></marker></defs>';
  var labels = '';
  S.edges.forEach(function(ed){
    var a = node(ed.from), bn = node(ed.to); if(!a||!bn) return;
    var ra = rect(a), rb = rect(bn), sd = sides(ra,rb), c = curve(port(ra,sd[0]),sd[0],port(rb,sd[1]),sd[1]);
    var on = sel && sel.kind==='edge' && sel.id===ed.id;
    out += '<path class="hit" data-eid="'+ed.id+'" d="'+c.d+'"/><path class="ln'+(ed.dashed?' dash':'')+(on?' sel':'')+'" d="'+c.d+'" marker-end="url(#'+(on?'arrS':'arr')+')"/>';
    if(ed.label) labels += '<div class="elabel'+(on?' sel':'')+'" data-eid="'+ed.id+'" style="left:'+c.mid[0]+'px;top:'+c.mid[1]+'px">'+esc(ed.label)+'</div>';
  });
  if(temp){ var tn = node(temp.from); if(tn){ var r = rect(tn), p = port(r,temp.side), c2 = curve(p,temp.side,[temp.x,temp.y],null); out += '<path class="ln temp" d="'+c2.d+'"/>'; } }
  edgesEl.innerHTML = out; labelsEl.innerHTML = labels;
}
function renderInsp(){
  if(!sel || editing){ insp.hidden = true; return; }
  if(sel.kind==='node'){
    var n = node(sel.id); if(!n){ insp.hidden = true; return; }
    insp.innerHTML = '<div class="grp">'+Object.keys(TYPES).map(function(t){return '<button class="btn'+(n.type===t?' on':'')+'" type="button" data-type="'+t+'" title="'+TYPES[t].n+'로 바꾸기"><i class="sw '+t+'"></i>'+TYPES[t].n+'</button>';}).join('')+'</div>'+
      '<div class="grp"><button class="btn" type="button" data-cmd="edit">글자 수정</button><button class="btn" type="button" data-cmd="wider">넓게</button><button class="btn" type="button" data-cmd="narrower">좁게</button><button class="btn" type="button" data-cmd="dup">복제</button><button class="btn danger" type="button" data-cmd="del">삭제</button></div>';
  } else {
    var ed = edge(sel.id); if(!ed){ insp.hidden = true; return; }
    insp.innerHTML = '<input id="elabelIn" type="text" placeholder="선 라벨 (예: 유효)" value="'+esc(ed.label)+'" aria-label="선 라벨">'+
      '<div class="grp"><button class="btn'+(ed.dashed?' on':'')+'" type="button" data-cmd="dash">점선</button><button class="btn" type="button" data-cmd="flip">방향 바꾸기</button><button class="btn danger" type="button" data-cmd="del">삭제</button></div>';
    var inp = $('elabelIn'), snapped = false;
    inp.addEventListener('input', function(){ if(!snapped){ snap(); snapped = true; } ed.label = inp.value; renderEdges(); status(); saveDraft(); });
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter') inp.blur(); e.stopPropagation(); });
  }
  insp.hidden = false;
}
function renderAll(){ renderNodes(); renderLanes(); renderEdges(); renderInsp(); }
function saveDraft(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({base:DATA.updatedAt||'', json:JSON.stringify(S)})); }catch(e){} }

/* ---------- text editing ---------- */
function editNode(id){
  var el = nodesEl.querySelector('.node[data-id="'+id+'"] .txt'); if(!el) return;
  var n = node(id), before = n.text, before_state = JSON.stringify(S);
  editing = id; renderInsp();
  try{ el.contentEditable = 'plaintext-only'; }catch(e){}
  if(el.contentEditable !== 'plaintext-only') el.contentEditable = 'true';
  el.focus();
  var range = document.createRange(); range.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(range);
  var cancelled = false;
  function onInput(){ sizes[id] = {w:el.parentNode.offsetWidth, h:el.parentNode.offsetHeight}; renderEdges(); }
  function onKey(e){
    e.stopPropagation();
    if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); el.blur(); }
    else if(e.key==='Escape'){ cancelled = true; el.blur(); }
  }
  function onBlur(){
    el.removeEventListener('input',onInput); el.removeEventListener('keydown',onKey); el.removeEventListener('blur',onBlur);
    var txt = (el.innerText||'').replace(/\n+$/,'').replace(/ /g,' ');
    editing = null;
    if(!cancelled && txt !== before){ undo.push(before_state); redo = []; n.text = txt; changed(); }
    else renderAll();
  }
  el.addEventListener('input',onInput); el.addEventListener('keydown',onKey); el.addEventListener('blur',onBlur);
}

/* ---------- commands ---------- */
function addNode(type){
  var r = vp.getBoundingClientRect(), c = toWorld(r.left+r.width/2, r.top+r.height/2);
  var w = TYPES[type].w, n = {id:uid('n'), type:type, x:Math.round((c.x-w/2)/10)*10, y:Math.round((c.y-30)/10)*10, w:w, text:''};
  if(sel && sel.kind==='node'){ var p = node(sel.id); if(p){ var pr = rect(p); n.x = Math.round((pr.x+pr.w/2-w/2)/10)*10; n.y = Math.round((pr.y+pr.h+60)/10)*10; } }
  snap(); S.nodes.push(n);
  if(sel && sel.kind==='node' && node(sel.id)) S.edges.push({id:uid('e'), from:sel.id, to:n.id, label:'', dashed:type==='planned'});
  sel = {kind:'node', id:n.id}; changed(); editNode(n.id);
}
function delSel(){
  if(!sel) return; snap();
  if(sel.kind==='node'){ var id = sel.id; S.nodes = S.nodes.filter(function(n){return n.id!==id;}); S.edges = S.edges.filter(function(e){return e.from!==id && e.to!==id;}); }
  else { var eid = sel.id; S.edges = S.edges.filter(function(e){return e.id!==eid;}); }
  sel = null; changed();
}
insp.addEventListener('click', function(ev){
  var b = ev.target.closest('button'); if(!b || !sel) return;
  if(b.dataset.type){ var n = node(sel.id); if(n && n.type!==b.dataset.type){ snap(); n.type = b.dataset.type; changed(); } return; }
  var cmd = b.dataset.cmd;
  if(cmd==='del') return delSel();
  if(sel.kind==='node'){
    var nd = node(sel.id); if(!nd) return;
    if(cmd==='edit') return editNode(nd.id);
    if(cmd==='wider'){ snap(); nd.w = Math.min(420, nd.w+40); changed(); }
    if(cmd==='narrower'){ snap(); nd.w = Math.max(120, nd.w-40); changed(); }
    if(cmd==='dup'){ snap(); var c = JSON.parse(JSON.stringify(nd)); c.id = uid('n'); c.x += 30; c.y += 30; S.nodes.push(c); sel = {kind:'node', id:c.id}; changed(); }
  } else {
    var ed = edge(sel.id); if(!ed) return;
    if(cmd==='dash'){ snap(); ed.dashed = !ed.dashed; changed(); }
    if(cmd==='flip'){ snap(); var t = ed.from; ed.from = ed.to; ed.to = t; changed(); }
  }
});
document.querySelectorAll('[data-add]').forEach(function(b){ b.addEventListener('click', function(){ addNode(b.dataset.add); }); });
$('undoBtn').addEventListener('click', doUndo);
$('redoBtn').addEventListener('click', doRedo);
$('zIn').addEventListener('click', function(){ var r = vp.getBoundingClientRect(); zoomAt(1.2, r.left+r.width/2, r.top+r.height/2); });
$('zOut').addEventListener('click', function(){ var r = vp.getBoundingClientRect(); zoomAt(1/1.2, r.left+r.width/2, r.top+r.height/2); });
$('zFit').addEventListener('click', fitAll);

/* ---------- pointer: select, drag, connect, pan, pinch ---------- */
var pointers = new Map(), act = null, pinch = null, lastTap = {id:null, t:0};
vp.addEventListener('pointerdown', function(e){
  if(editing && e.target.closest('.txt[contenteditable="true"],.txt[contenteditable="plaintext-only"]')) return;
  if(e.target.closest('.insp')) return;
  if(editing && document.activeElement && document.activeElement.blur) document.activeElement.blur(); // commit text first
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size === 2){
    var p = Array.from(pointers.values());
    pinch = {d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y), z:view.z};
    if(act && act.kind==='drag' && act.moved){ /* keep */ } act = null; return;
  }
  var h = e.target.closest('.h'), nd = e.target.closest('.node'), ed = e.target.closest('[data-eid]');
  try{ vp.setPointerCapture(e.pointerId); }catch(_){}
  if(h && nd){
    act = {kind:'connect', from:nd.dataset.id, side:h.dataset.side};
    var w = toWorld(e.clientX,e.clientY); temp = {from:nd.dataset.id, side:h.dataset.side, x:w.x, y:w.y}; renderEdges(); e.preventDefault(); return;
  }
  if(nd){
    var n = node(nd.dataset.id);
    var wasSel = sel && sel.kind==='node' && sel.id===n.id;
    if(!wasSel){ sel = {kind:'node', id:n.id}; renderNodes(); renderEdges(); renderInsp(); }
    act = {kind:'drag', id:n.id, sx:e.clientX, sy:e.clientY, ox:n.x, oy:n.y, moved:false, wasSel:wasSel}; e.preventDefault(); return;
  }
  if(ed){ sel = {kind:'edge', id:ed.dataset.eid}; renderNodes(); renderEdges(); renderInsp(); act = null; return; }
  if(sel){ sel = null; renderNodes(); renderEdges(); renderInsp(); }
  act = {kind:'pan', sx:e.clientX, sy:e.clientY, ox:view.x, oy:view.y}; vp.classList.add('panning');
});
vp.addEventListener('pointermove', function(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pinch && pointers.size === 2){
    var p = Array.from(pointers.values()), d = Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    zoomAt((pinch.z*d/pinch.d)/view.z, (p[0].x+p[1].x)/2, (p[0].y+p[1].y)/2); return;
  }
  if(!act) return;
  if(act.kind==='pan'){ view.x = act.ox + e.clientX-act.sx; view.y = act.oy + e.clientY-act.sy; applyView(); }
  else if(act.kind==='drag'){
    var dx = (e.clientX-act.sx)/view.z, dy = (e.clientY-act.sy)/view.z;
    if(!act.moved && Math.hypot(dx,dy)*view.z < 4) return;
    if(!act.moved){ snap(); act.moved = true; }
    var n = node(act.id); n.x = Math.round((act.ox+dx)/10)*10; n.y = Math.round((act.oy+dy)/10)*10;
    var el = nodesEl.querySelector('.node[data-id="'+act.id+'"]'); if(el){ el.style.left = n.x+'px'; el.style.top = n.y+'px'; }
    renderEdges();
  }
  else if(act.kind==='connect'){ var w = toWorld(e.clientX,e.clientY); temp.x = w.x; temp.y = w.y; renderEdges(); }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinch = null;
  if(!act) return;
  var a = act; act = null; vp.classList.remove('panning');
  if(a.kind==='drag'){
    if(a.moved){ renderLanes(); status(); saveDraft(); renderEdges(); }
    else if(e.type==='pointerup'){
      var now = Date.now();
      if(lastTap.id===a.id && now-lastTap.t < 450){ lastTap = {id:null,t:0}; editNode(a.id); }
      else lastTap = {id:a.id, t:now};
    }
  }
  if(a.kind==='connect'){
    temp = null;
    var t = document.elementFromPoint(e.clientX, e.clientY), tn = t && t.closest && t.closest('.node');
    if(tn && tn.dataset.id !== a.from){
      var dup = S.edges.some(function(x){return x.from===a.from && x.to===tn.dataset.id;});
      if(!dup){ snap(); var ne = {id:uid('e'), from:a.from, to:tn.dataset.id, label:'', dashed:false}; S.edges.push(ne); sel = {kind:'edge', id:ne.id}; changed(); setTimeout(function(){var i=$('elabelIn'); if(i) i.focus();},0); return; }
    } else if(!tn){
      // dropped on empty space: create a new screen there, connected
      var w = toWorld(e.clientX,e.clientY), src = node(a.from);
      var nt = src && src.type==='planned' ? 'planned' : 'screen', nw = TYPES[nt].w;
      snap(); var nn = {id:uid('n'), type:nt, x:Math.round((w.x-nw/2)/10)*10, y:Math.round((w.y-28)/10)*10, w:nw, text:''};
      S.nodes.push(nn); S.edges.push({id:uid('e'), from:a.from, to:nn.id, label:'', dashed:nt==='planned'});
      sel = {kind:'node', id:nn.id}; changed(); editNode(nn.id); return;
    }
    renderEdges();
  }
}
vp.addEventListener('pointerup', endPointer);
vp.addEventListener('pointercancel', endPointer);
vp.addEventListener('dblclick', function(e){
  if(editing) return;
  var nd = e.target.closest('.node'); if(nd){ sel = {kind:'node', id:nd.dataset.id}; editNode(nd.dataset.id); return; }
  var ed = e.target.closest('[data-eid]'); if(ed){ sel = {kind:'edge', id:ed.dataset.eid}; renderEdges(); renderInsp(); var i = $('elabelIn'); if(i) i.focus(); }
});
vp.addEventListener('wheel', function(e){
  e.preventDefault();
  if(e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY*0.01), e.clientX, e.clientY);
  else { view.x -= e.deltaX; view.y -= e.deltaY; applyView(); }
}, {passive:false});
document.addEventListener('keydown', function(e){
  var tag = (document.activeElement && document.activeElement.tagName)||'';
  if(editing || tag==='INPUT' || tag==='TEXTAREA') return;
  var mod = e.ctrlKey || e.metaKey;
  if(mod && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); }
  else if(mod && e.key.toLowerCase()==='y'){ e.preventDefault(); doRedo(); }
  else if(mod && e.key.toLowerCase()==='s'){ e.preventDefault(); if(!$('saveBtn').disabled) $('saveBtn').click(); }
  else if((e.key==='Delete'||e.key==='Backspace') && sel){ e.preventDefault(); delSel(); }
  else if(e.key==='Enter' && sel && sel.kind==='node'){ e.preventDefault(); editNode(sel.id); }
  else if(e.key==='Escape' && sel){ sel = null; renderAll(); }
});

/* ---------- status & save ---------- */
function status(){
  var dirty = JSON.stringify(S) !== SAVED, st = $('status');
  st.classList.toggle('dirty', dirty);
  st.textContent = dirty ? '저장 안 됨' : (DATA.updatedAt ? '저장됨 · '+new Date(DATA.updatedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '');
  $('saveBtn').disabled = !dirty || !canWrite;
  $('undoBtn').disabled = !undo.length; $('redoBtn').disabled = !redo.length;
}
var tt; function toast(m){ var el = $('toast'); el.textContent = m; el.hidden = false; clearTimeout(tt); tt = setTimeout(function(){ el.hidden = true; }, 2400); }
var SKEL = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
function buildDoc(data){
  var json = JSON.stringify(data).replace(/</g,'\\u003c');
  return SKEL +
    '<title>hashell 동기화 흐름</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap">\n' +
    '<style id="css">' + $('css').textContent + '<\/style>\n\n' + ROOT_HTML + '\n\n' +
    '<script type="application/json" id="flow-data">' + json + '<\/script>\n' +
    '<script id="app">' + $('app').textContent + '<\/script>\n</body></html>';
}
$('saveBtn').addEventListener('click', async function(){
  if(!artifactCap) return;
  var btn = this; btn.disabled = true; btn.textContent = '저장 중…';
  try{
    try{ localStorage.removeItem(DRAFT_KEY); }catch(_){}
    await artifactCap.publish(buildDoc({updatedAt:new Date().toISOString(), lanes:S.lanes, nodes:S.nodes, edges:S.edges}));
  }catch(err){
    saveDraft();
    var code = err && err.code;
    toast(code==='conflict' ? '다른 곳에서 먼저 저장됐어요. 최신 버전으로 다시 열려요' : '저장하지 못했어요'+(code?' ('+code+')':''));
    btn.textContent = '저장'; status();
  }
});

/* ---------- boot ---------- */
renderAll(); fitWidth(); status();
window.addEventListener('resize', function(){ clearTimeout(window.__rz); window.__rz = setTimeout(applyView, 150); });
if(window.claude && claude.use){
  claude.use('artifact').then(function(a){ artifactCap = a; canWrite = !!a; if(!a) $('saveBtn').title = '이 화면에서는 저장 권한이 없어요'; status(); });
} else { $('saveBtn').title = '이 화면에서는 저장할 수 없어요'; }
})();
</script>
