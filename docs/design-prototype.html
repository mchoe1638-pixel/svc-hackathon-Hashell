<title>hashell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 갤럭시 S25(360×780) 폰 화면 하나만 가운데. 앱 화면은 hashell 에메랄드→청록 그라데이션(정산 끝난 돈의 초록), 여행 돌아보기는 여행지 색(데이터베이스) */
:root{
  /* 기준 세 색: 파랑(기본) #4B5CF1, 빨강 #F14B5C, 초록 #5CF14B. 흰 바탕 글자용은 진한 단계 */
  --blue:#4B5CF1; --red:#F14B5C; --green:#5CF14B;
  --brand:#4B5CF1; --brand-ink:#3A4AD9; --brand-soft:#EDEFFE;
  --grad:linear-gradient(135deg,#3A4AD9 0%,#4B5CF1 55%,#5E6EF4 100%);
  --ink:#191F28; --sub:#5F6B7A; --line:#E3E7EC; --field:#F2F4F7; --paper:#FFFFFF; --stage:#E3E8F0; --bezel:#1C1E22;
  --send:#CF404F; --ok:#328429; --est:#B25E09; --est-soft:#FFF4E5;
  --accent:#E0362C; --glow:#FFB81C; --night:#0A1433; --foam:#FFF9EC; --butter:#FFE08A;
  --m-mk:#4B5CF1; --m-sh:#F14B5C; --m-jh:#5CF14B; --m-mj:#F1C14B; --m-new:#B44BF1;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--stage)}
body{color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
.shell{max-width:360px;margin:0 auto}

/* 안내 패널 */
.panel{display:grid;gap:22px;padding-top:8px;min-width:0}
.panel h1{font-weight:900;font-size:44px;line-height:1.1;margin:0;color:var(--brand);background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.04em;justify-self:start}
.panel p{margin:0;color:var(--sub);max-width:46ch}
.pgroup{display:grid;gap:8px}
.pgroup h2{font-size:13px;font-weight:700;margin:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{min-height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--paper);cursor:pointer;font-size:14px}
.pills button[aria-current="true"]{background:var(--ink);color:var(--paper)}
.pills button .sm{color:var(--sub);font-size:12px;margin-left:4px}
.pills button[aria-current="true"] .sm{color:var(--line)}
.dests{display:flex;flex-wrap:wrap;gap:8px}
.dests span{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border-radius:12px;padding:4px 10px 4px 4px;font-size:13px}
.dests img,.dests svg{width:28px;height:28px}
.plinks{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;color:var(--sub)}
.plinks button{border:0;background:none;color:var(--brand);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 0;min-height:40px}

/* 갤럭시 S25 */
.phone{width:100%;max-width:360px;height:min(780px,calc(100dvh - 48px));min-height:600px;margin-inline:auto;background:var(--paper);
  border-radius:38px;box-shadow:0 0 0 7px var(--bezel),0 0 0 8px #3A3D44,0 40px 70px -30px rgba(10,20,51,.55);overflow:hidden;display:flex;flex-direction:column}
.sbar{position:relative;display:flex;justify-content:space-between;align-items:center;height:30px;padding:0 24px;font-size:12px;font-weight:500;background:var(--paper);flex:none}
.sbar::after{content:"";position:absolute;left:50%;top:8px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--bezel)}
.sbar .ic{display:flex;gap:5px;align-items:center}
.sbar .bat{width:20px;height:10px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.sbar .bat::after{content:"";position:absolute;inset:1px;right:5px;background:currentColor;border-radius:1px}
.gest{height:20px;display:grid;place-items:center;background:var(--paper);flex:none}
.gest i{width:100px;height:4px;border-radius:2px;background:var(--ink);opacity:.75}
.app{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;isolation:isolate}
@media (max-width:480px){.phone{border-radius:22px;box-shadow:0 0 0 1px var(--line);height:calc(100dvh - 48px);max-width:none}.sbar,.gest{display:none}}
.bar{display:flex;align-items:center;gap:4px;min-height:54px;padding:6px 14px 6px 6px;border-bottom:1px solid var(--line);background:var(--paper)}
.back{width:44px;height:44px;border:0;background:none;border-radius:12px;font-size:22px;cursor:pointer;display:grid;place-items:center}
.back[hidden]+.t{padding-left:14px}
.t{flex:1;min-width:0;font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--brand-soft);color:var(--brand)}
.status.LOCKED{background:var(--field);color:var(--ink)}
.status.SETTLED{background:var(--ink);color:var(--paper)}
.route{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--sub);padding:4px 16px;background:var(--field);white-space:nowrap}
.route span{overflow:hidden;text-overflow:ellipsis}
.screen{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:16px;position:relative;background:var(--paper)}
.screen>*{flex-shrink:0}
.screen{scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.grey{background:var(--field)}
.screen.flush{padding-top:0}
.foot{display:flex;gap:8px;padding:12px 18px 14px;border-top:1px solid var(--line);background:var(--paper)}

/* 공통 */
.btn{flex:1;min-width:0;white-space:nowrap;min-height:52px;border-radius:14px;border:0;background:var(--brand);background-image:var(--grad);color:var(--paper);font-weight:700;font-size:16px;cursor:pointer;padding:0 14px}
.btn.ghost{background:var(--field);background-image:none;color:var(--ink)}
.btn.danger{background:var(--paper);background-image:none;color:var(--send);box-shadow:inset 0 0 0 1.5px var(--send)}
.btn.sm{flex:none;min-height:44px;padding:0 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.35;cursor:default}
.q{font-size:22px;line-height:1.36;font-weight:700;margin:4px 0 0;text-wrap:balance;letter-spacing:-.02em;word-break:keep-all}
.hint{font-size:14px;color:var(--sub);margin:0}
.field{display:grid;gap:6px;font-size:14px;color:var(--sub);font-weight:500}
.field input,.field select{font-size:16px;color:var(--ink);background:var(--field);border:1.5px solid transparent;border-radius:12px;min-height:52px;padding:0 14px;width:100%}
.field input:focus,.field select:focus{border-color:var(--brand);outline:none;background:var(--paper)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--ink)) 74%,var(--butter)) 15%,color-mix(in srgb,color-mix(in srgb,var(--c,var(--ink)) 45%,var(--brand)) 16%,var(--butter)) 85%);color:color-mix(in srgb,var(--c,var(--ink)) 40%,var(--ink));display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.seg{display:flex;background:var(--field);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-width:0;white-space:nowrap;overflow:hidden;min-height:44px;border:0;border-radius:9px;background:transparent;font-size:15px;color:var(--sub);cursor:pointer;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(25,31,40,.14)}
.est{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:500;color:var(--est);background:var(--est-soft);border-radius:6px;padding:1px 6px;border:0;cursor:pointer;vertical-align:1px}
.note{font-size:13px;color:var(--est);background:var(--est-soft);border-radius:10px;padding:10px 12px;margin:0}
.info{font-size:14px;background:var(--brand-soft);color:var(--brand-ink);border-radius:12px;padding:12px 14px;margin:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.list{display:grid}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.row:last-child{border-bottom:0}
button.row{cursor:pointer}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:13px;color:var(--sub)}
.mine-line{display:block;font-size:13px;color:var(--brand);font-weight:500}
.right{text-align:right;flex:none}
.day{font-size:13px;color:var(--sub);font-weight:700;margin:8px 0 -4px}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--brand-soft);color:var(--brand-ink);font-weight:500;border:0;width:100%;text-align:left;cursor:pointer;min-height:56px}
.banner .go{margin-left:auto;font-size:18px}
.banner.night{background:var(--night);background-image:linear-gradient(160deg,color-mix(in srgb,var(--night) 45%,#4B5CF1),color-mix(in srgb,var(--night) 60%,#5E6EF4));color:var(--foam);padding:16px}
.banner.night>span{min-width:0;font-size:13px;line-height:1.45}
.banner.night strong{display:block;font-weight:900;font-size:18px;color:var(--glow);line-height:1.3;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;margin-bottom:2px}
.banner.night img,.banner.night svg{width:56px;height:56px;flex:none}
.toast{position:absolute;left:18px;right:18px;bottom:84px;z-index:70;background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 14px;font-size:14px}
.scrim{position:absolute;inset:0;background:rgba(10,20,51,.45);z-index:40;display:flex;align-items:flex-end}
.sheet{background:var(--paper);width:100%;border-radius:22px 22px 0 0;padding:24px 18px 18px;display:grid;gap:12px}
.sheet .acts{display:flex;gap:8px;margin-top:6px}

/* 여행지 미리보기 */
.dest{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--accent) 10%,var(--paper));transition:background-color .3s}
.dest .pics{display:flex;flex:none}
.dest .pics img,.dest .pics svg{width:56px;height:56px}
.dest .pics img+img{margin-left:-14px}
.dest>div:last-child{min-width:0}
.dest b{display:block;font-size:16px;white-space:nowrap;overflow:hidden}
.dest span{font-size:13px;color:var(--sub)}
.dest.flip .pics{animation:swapIn .28s var(--ease-out)}
@keyframes swapIn{from{transform:scale(.92);opacity:0;filter:blur(3px)}}
.trip{display:flex;align-items:center;gap:12px}
.trip img,.trip svg{width:48px;height:48px;flex:none}
.trip>div{min-width:0}
.trip b{display:block;font-size:15px;white-space:nowrap;overflow:hidden}

/* 홈 */
.balance{background:var(--brand);background-image:var(--grad);color:var(--paper);border-radius:20px;padding:18px;display:grid;gap:4px;min-width:0}
.balance .lbl{font-size:14px;font-weight:500;opacity:.9}
.balance .v{white-space:nowrap;overflow:hidden;font-size:32px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.balance .lbl b{display:inline-block;margin-left:6px;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--paper);color:var(--brand-ink)}
.balance .lbl b.send{color:var(--send)}
.balance .split{display:flex;gap:4px 16px;font-size:13px;opacity:.9;margin-top:8px;flex-wrap:wrap}
.empty{text-align:center;padding:32px 8px;color:var(--sub)}

/* 지출 추가 */
.opt{display:grid;gap:4px;text-align:left;padding:20px 18px;border-radius:18px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer}
.opt b{font-size:18px}
.opt span{color:var(--sub);font-size:14px}
.opt.main{border-color:var(--brand);background:var(--brand-soft)}
.screen.reading{background:var(--field);justify-content:center}
.scanwrap{display:flex;justify-content:center;filter:drop-shadow(0 10px 18px rgba(20,32,28,.18))}
.scan{--z:7px;width:52%;max-width:190px;aspect-ratio:3/4;background:var(--paper);position:relative;overflow:hidden;padding:calc(12px + var(--z)) 14px calc(12px + var(--z));display:flex;flex-direction:column;gap:7px;
  -webkit-mask:linear-gradient(#000 0 0) center/100% calc(100% - var(--z)*2) no-repeat,conic-gradient(from 135deg at top,#000 90deg,#0000 0) top/calc(var(--z)*2) var(--z) repeat-x,conic-gradient(from -45deg at bottom,#000 90deg,#0000 0) bottom/calc(var(--z)*2) var(--z) repeat-x;
  mask:linear-gradient(#000 0 0) center/100% calc(100% - var(--z)*2) no-repeat,conic-gradient(from 135deg at top,#000 90deg,#0000 0) top/calc(var(--z)*2) var(--z) repeat-x,conic-gradient(from -45deg at bottom,#000 90deg,#0000 0) bottom/calc(var(--z)*2) var(--z) repeat-x}
.scan i{display:block;height:5px;border-radius:3px;background:var(--field)}
.scan .c{align-self:center}
.scan .lr{display:flex;justify-content:space-between;gap:12px}
.scan .cut{border-top:1.5px dashed var(--line);margin:2px 0}
.scan .tot i{height:7px;background:var(--line)}
.scan::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent calc(100% - 4px),var(--brand) calc(100% - 4px));box-shadow:0 14px 18px -6px color-mix(in srgb,var(--brand) 45%,transparent);animation:scan 1.6s ease-in-out infinite alternate;transform:translateY(-100%)}
@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(0)}}

/* 품목 체크 */
.mine{position:sticky;top:0;z-index:2;margin:0 -18px;padding:14px 18px 16px;background:var(--brand);background-image:var(--grad);color:var(--paper);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.mine .lbl{font-size:13px;opacity:.85}
.mine>div:first-child{min-width:0}
.mine .v{white-space:nowrap;overflow:hidden;font-size:30px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mine .y{font-size:13px;opacity:.85;text-align:right}
.mine.flash .v{animation:flash .3s var(--ease-out)}
@keyframes flash{from{transform:translateY(-6px);opacity:.35;filter:blur(2px)}}
.receipt{--z:9px;background:var(--paper);padding:calc(16px + var(--z)) 14px calc(22px + var(--z));
  -webkit-mask:linear-gradient(#000 0 0) center/100% calc(100% - var(--z)*2) no-repeat,conic-gradient(from 135deg at top,#000 90deg,#0000 0) top/calc(var(--z)*2) var(--z) repeat-x,conic-gradient(from -45deg at bottom,#000 90deg,#0000 0) bottom/calc(var(--z)*2) var(--z) repeat-x;
  mask:linear-gradient(#000 0 0) center/100% calc(100% - var(--z)*2) no-repeat,conic-gradient(from 135deg at top,#000 90deg,#0000 0) top/calc(var(--z)*2) var(--z) repeat-x,conic-gradient(from -45deg at bottom,#000 90deg,#0000 0) bottom/calc(var(--z)*2) var(--z) repeat-x}
.rhead{text-align:center;display:grid;gap:2px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.rhead b{font-size:17px}
.item{display:grid;gap:10px;padding:14px 0;border-bottom:1px dashed var(--line)}
.item-top{display:flex;gap:10px;align-items:flex-start}
.item-name{flex:1;min-width:0;font-weight:700}
.item-name small{display:block;font-weight:400;color:var(--sub);font-size:13px}
.item .amt{max-width:48%;overflow:hidden;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .amt small{display:block;color:var(--sub);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{max-width:100%;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 11px 0 7px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--sub);font-size:14px;cursor:pointer}
.mchip .dot{width:28px;height:28px;border-radius:50%;background:var(--field);color:var(--sub);display:grid;place-items:center;font-size:12px;font-weight:700}
.mchip[aria-pressed="true"]{border-color:color-mix(in srgb,var(--c) 55%,var(--brand));color:var(--ink);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 10%,var(--paper)),color-mix(in srgb,var(--brand) 6%,var(--paper)))}
.mchip[aria-pressed="true"] .dot{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 74%,var(--butter)) 15%,color-mix(in srgb,color-mix(in srgb,var(--c) 45%,var(--brand)) 16%,var(--butter)) 85%);color:color-mix(in srgb,var(--c) 40%,var(--ink))}
.mchip[aria-pressed="false"] .nm{text-decoration:line-through}
.mchip.me{font-weight:700}
.sum{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--sub);padding-top:10px}
.sum.total{color:var(--ink);font-weight:700;font-size:16px}
.estbox{font-size:13px;color:var(--sub);margin:4px 0 0}

/* 정산 */
.xfer{display:flex;align-items:center;gap:8px;min-height:64px;padding:10px 0;border-bottom:1px solid var(--line)}
.xfer:last-child{border-bottom:0}
.xfer .who{flex:1;min-width:0;display:flex;align-items:center;gap:5px;font-weight:700;flex-wrap:wrap}
.xfer .who svg{flex:none;color:var(--sub)}
.xfer .amt{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.ok{color:var(--ok);font-size:13px;font-weight:700;white-space:nowrap}
.pos{color:var(--ok)} .neg{color:var(--send)}
.qr{display:block;width:140px;height:140px;margin:4px auto 0;image-rendering:pixelated}
.link{display:flex;align-items:center;gap:8px;background:var(--field);border-radius:12px;padding:6px 6px 6px 14px}
.link span,.link label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.pick{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);width:100%;text-align:left;cursor:pointer}
.pick[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.pick:disabled{cursor:default;color:var(--sub)}
.pick .main{flex:1}
.center{text-align:center;margin-top:48px;display:grid;gap:10px;justify-items:center}
.wordmark{font-weight:900;font-size:52px;line-height:1.1;color:var(--brand);background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.05em}

/* 여행 돌아보기 (색은 여행지 데이터) */
.wr{position:absolute;inset:0;z-index:60;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none}
.wr-prog{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:3}
.wr-prog i{flex:1;height:3px;border-radius:2px;background:color-mix(in srgb,currentColor 30%,transparent);overflow:hidden;position:relative}
.wr-prog i.done{background:currentColor}
.wr-prog i.now::after{content:"";position:absolute;inset:0;background:currentColor;transform-origin:left;animation:fill var(--dur) linear forwards}
.wr-prog.still i.now::after{animation:none;transform:none}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.wr-close{position:absolute;top:22px;right:6px;width:44px;height:44px;border:0;background:none;color:inherit;font-size:26px;cursor:pointer;z-index:3}
.slide{position:absolute;inset:0;padding:70px 22px 26px;display:flex;flex-direction:column;gap:14px}
/* 장마다 색은 달라도 밝기와 방향은 같게: 첫 장(메인 그라데이션)과 무게를 맞춘다 */
.s-brand{background:var(--brand);background-image:linear-gradient(160deg,#3A4AD9 0%,#4B5CF1 50%,#5E6EF4 100%);color:var(--foam)}
.s-glow{background:var(--glow);background-image:linear-gradient(160deg,color-mix(in srgb,var(--glow) 70%,var(--paper)) 0%,var(--glow) 55%,color-mix(in srgb,var(--glow) 72%,var(--accent)) 100%);color:var(--night)}
.s-night{background:var(--night);background-image:linear-gradient(160deg,color-mix(in srgb,var(--night) 45%,#4B5CF1) 0%,color-mix(in srgb,var(--night) 60%,#5E6EF4) 100%);color:var(--foam)}

: "おにぎり", "k": "오니기리", "u": 158, "q": 5, "cat": "meal", "eat": ["mk", "sh", "jh", "mj"]}, {"o": "ファミチキ", "k": "패미치키", "u": 220, "q": 2, "cat": "snack", "eat": ["jh", "mj"]}, {"o": "綾鷹", "k": "녹차", "u": 160, "q": 2, "cat": "drink", "eat": ["jh"], "tag": "tea"}]}, {"id": "daruma", "name": "쿠시카츠 다루마", "orig": "串カツだるま 新世界総本店", "day": 2, "payer": "mk", "pay": "CARD", "items": [{"o": "串カツ盛り合わせ", "k": "쿠시카츠 모둠", "u": 1650, "q": 2, "cat": "meal", "eat": ["mk", "sh", "jh", "mj"]}, {"o": "生ビール 中", "k": "생맥주 (중)", "u": 600, "q": 3, "cat": "alcohol", "eat": ["sh"], "tag": "beer"}, {"o": "ハイボール", "k": "하이볼", "u": 550, "q": 2, "cat": "alcohol", "eat": ["mj"], "tag": "hb"}, {"o": "ウーロン茶", "k": "우롱차", "u": 350, "q": 1, "cat": "drink", "eat": ["jh"], "tag": "tea"}]}], "parsed": {"name": "타코야키 쥬하치반", "orig": "たこ焼き 十八番 道頓堀店", "day": 3, "items": [{"o": "たこ焼き 8個", "k": "타코야키 8개", "u": 650, "q": 2, "cat": "snack", "eat": []}, {"o": "ねぎマヨ", "k": "파 마요 타코야키", "u": 750, "q": 1, "cat": "snack", "eat": []}, {"o": "ハイボール", "k": "하이볼", "u": 500, "q": 2, "cat": "alcohol", "eat": [], "tag": "hb"}, {"o": "ラムネ", "k": "라무네", "u": 250, "q": 1, "cat": "drink", "eat": []}]}};

function tripFrom(id, name, cash, fee) {
  const d = destOf(id);
  return { dest: id, name, cur: clone(d.cur), cash: cash ?? d.cash, fee: fee ?? d.fee, tts: d.tts,

/* ---------- 계산 (정수만, 최대 잔여법, 동점은 참여 순서) ---------- */
const order = () => S.members.map(m => m.id);

function split(total, ids) {
  const list = sorted(ids), n = list.length, out = {};
  if (!n) return out;
  const base = Math.floor(total / n), r = total - base * n;

  const ids = order().filter(id => (w[id] || 0) > 0), W = ids.reduce((s, id) => s + w[id], 0), out = {};
  if (!W) return out;

  const rem = ids.map((id, i) => { const p = total * w[id], b = Math.floor(p / W); out[id] = b; used += b; return { id, r: p % W, i }; });

  for (let k = 0; k < total - used; k++) out[rem[k].id]++;

const foreign = () => S.trip.cur.code !== "KRW";
const yenOf = e => e.items.reduce((s, i) => s + i.u * i.q, 0);
// 환산은 지출 단위로 먼저. 현금 = 방의 환전 환율, 카드 = TTS × (1 + 수수료) 추정

  const y = yenOf(e), T = S.trip, per = T.cur.per;

function sharesOf(e) {
  const local = {};
  e.items.forEach(i => { const s = split(i.u * i.q, i.eat); for (const id in s) local[id] = (local[id] || 0) + s[id]; });
  return { local, krw: allocate(krwOf(e), local) };
}
function ledger() {

function transfers() {
  const { eaten, paid } = ledger(), cr = [], db = [];
  order().forEach(id => { const b = paid[id] - eaten[id]; if (b > 0) cr.push({ id, v: b }); if (b < 0) db.push({ id, v: -b }); });

const payLabel = p => p === "CASH" ? "현금" : foreign() ? "해외 카드" : "카드";
let toastTimer = null, parseTimer = null, wrTimer = null;

function toast(msg) {
  S.toast = msg;
  renderToast();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; renderToast(); }, 2600);
}
function copy(text, done) {
  try {
    navigator.clipboard.writeText(text).then(() => toast(done), () => toast("복사하지 못했어요. 길게 눌러 직접 복사해주세요."));
  } catch (e) { toast("복사하지 못했어요. 길게 눌러 직접 복사해주세요."); }
}

/* ---------- 여행 만들기: 이름을 치는 동안 여행지를 알아본다 ---------- */
function previewId() { return detect(S.form.name) || S.form.cur || "osaka"; }
function destCard() {
  const id = previewId(), d = destOf(id), hit = !!detect(S.form.name);
  const accent = d.colors && d.colors.accent;
  return `<div class="dest" id="dest-card" style="${accent ? `--accent:${accent}` : ""}">
    <div class="pics">${hit ? artImg(d, 0) + artImg(d, 1) : GENERIC_ART}</div>
    <div>${hit ? `<b>${esc(d.country)} ${esc(d.name)}로 맞췄어요</b><span>${esc(d.cur.code)} ${esc(d.cur.unit)}, ${esc(d.days[0])}부터 ${esc(d.nights)} 예시</span>`
      : `<b>등록된 여행지가 아니에요</b><span>통화를 고르면 그 통화의 예시 영수증으로 보여줘요</span>`}</div></div>`;
}
function rateFields() {
  const d = destOf(previewId());
  if (d.cur.code === "KRW") return `<p class="hint" id="rate-box">원화 여행이라 환율 입력이 필요 없어요.</p>`;
  return `<div class="two" id="rate-box">
    <label class="field">현금 환율 (₩/${d.cur.per === 1 ? "1" : d.cur.per}${esc(d.cur.unit)})<input id="f-cash" type="number" inputmode="decimal" value="${d.cash}"></label>
    <label class="field">카드 수수료 (%)<input id="f-fee" type="number" inputmode="decimal" step="0.1" value="${(d.fee / 10).toFixed(1)}"></label></div>`;
}
function curOptions() {
  const seen = new Set(), id = previewId();
  return Object.entries(DESTS).sort((a, b) => (a[1].order || 9) - (b[1].order || 9)).filter(([, d]) => !seen.has(d.cur.code) && seen.add(d.cur.code))
    .map(([k, d]) => `<option value="${k}"${destOf(id).cur.code === d.cur.code ? " selected" : ""}>${esc(d.cur.code)} ${esc(d.cur.unit)}</option>`).join("");
}
function refreshCreate(flip) {
  const card = $("dest-card"), rb = $("rate-box"), sel = $("f-cur");
  if (!card) return;
  card.outerHTML = destCard();
  rb.outerHTML = rateFields();
  sel.innerHTML = curOptions();
  if (flip) $("dest-card").classList.add("flip");
  refit();
}

/* ---------- QR (모양만 흉내) ---------- */
function drawQR() {
  const c = $("qr"); if (!c) return;
  const x = c.getContext("2d"), n = 29;
  x.clearRect(0, 0, n, n);
  x.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
  let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = 2; i < n - 2; i++) for (let j = 2; j < n - 2; j++) {
    const inF = (i < 10 && j < 10) || (i > n - 11 && j < 10) || (i < 10 && j > n - 11);
    if (!inF && rnd() > 0.52) x.fillRect(i, j, 1, 1);
  }
  [[2, 2], [n - 9, 2], [2, n - 9]].forEach(([px, py]) => {
    for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++)
      if (i === 0 || j === 0 || i === 6 || j === 6 || (i > 1 && i < 5 && j > 1 && j < 5)) x.fillRect(px + i, py + j, 1, 1);
  });
}

/* 한 장 = 6.5초. 누르면 넘김, 길게 누르면 멈춤(스토리와 같은 규칙) */

function openWrapped() {
  if (!me().bound) return go("join");
  if (S.route !== "home" && S.route !== "settled") go("home");
  S.wrapped = true; S.slide = 0; S.wrOpening = true;
  try { history.replaceState(null, "", "#wrapped"); } catch (e) {}
  render();
}
function closeWrapped(animate = true) {
  clearTimeout(wrTimer);
  const el = $("overlay").querySelector(".wr");
  const done = () => {
    S.wrapped = false;
    try { history.replaceState(null, "", "#" + S.route); } catch (e) {}
    render();
  };
  if (!animate || !el || reduceMotion()) return done();
  el.classList.add("closing");
  setTimeout(done, 190);
}
function forceSettled() {
  if (settled()) return;
  S.members.forEach(m => { m.bound = true; });
  if (!me().bound) S.viewer = "mk";
  S.status = "SETTLED"; S.frozen = transfers(); S.recv = {};
}
// 여행 이름에 맞는 여행지로 통화·예시 영수증·날짜·칭호·색을 모두 바꾼다
function applyTrip(id, name, cash, fee) {
  const d = destOf(id);
  S.trip = tripFrom(id, name, cash, fee);
  S.expenses = clone(d.expenses);
  S.expId = null; S.status = "OPEN"; S.frozen = null; S.recv = {}; S.touched = true;
}

/* ---------- 입력 처리 ---------- */
// 그림을 못 불러오면 기본 그림(여행 가방)으로
document.addEventListener("error", e => {
  const t = e.target;
  if (t.tagName !== "IMG" || !t.hasAttribute("data-art")) return;
  const w = document.createElement("span");
  w.innerHTML = GENERIC_ART.replace("<svg", `<svg class="${t.className}"`);
  t.replaceWith(w.firstChild);
}, true);
document.addEventListener("input", e => {
  if (e.target.id !== "f-name") return;
  S.form.name = e.target.value;
  if (e.isComposing) return;
  const before = S.lastPreview;
  S.lastPreview = previewId();
  if (before !== S.lastPreview) refreshCreate(true);
});
document.addEventListener("compositionend", e => {
  if (e.target.id !== "f-name") return;
  S.form.name = e.target.value;
  const before = S.lastPreview;
  S.lastPreview = previewId();
  if (before !== S.lastPreview) refreshCreate(true);
});
document.addEventListener("change", e => {
  if (e.target.id !== "f-cur") return;
  S.form.cur = e.target.value;
  const before = S.lastPreview;
  S.lastPreview = previewId();
  if (before !== S.lastPreview) refreshCreate(false);
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  if (t.classList.contains("scrim") && e.target !== t) return;
  const [a, p, q] = t.dataset.act.split(":");
  switch (a) {
    case "go": return go(p);
    case "open": S.expId = p; return go("check");
    case "viewer":
      S.viewer = p; S.pick = null;
      if (S.wrapped) closeWrapped(false);
      return go(!me().bound ? "join" : S.route === "join" ? "home" : S.route);
    case "jump":
      if (p === "settled" || p === "wrapped") forceSettled();
      if (p === "join") { const u = S.members.find(m => !m.bound); if (u) S.viewer = u.id; else toast("모두 참여했어요. 처음 상태로 돌리면 다시 볼 수 있어요."); }
      if (p === "create" && !isOrg()) S.viewer = "mk";
      if (p === "wrapped") return openWrapped();
      return go(p);
    case "reset": clearTimeout(wrTimer); S = initial(); S.lastPreview = null; return go("create");
    case "add-member": {
      const v = $("f-member").value.trim();
      if (!v) return toast("추가할 이름을 적어주세요");
      if (S.members.some(m => m.name === v)) return toast("이미 있는 이름이에요");
      S.members.push({ id: "n" + Date.now(), name: v, bound: false });
      return render();
    }
    case "create-trip": {
      const name = $("f-name").value.trim();
      if (!name) return toast("여행 이름을 적어주세요");
      S.form.name = name;
      const id = previewId(), d = destOf(id);
      let cash, fee;
      if (d.cur.code !== "KRW") {
        cash = Math.round(parseFloat($("f-cash").value)); fee = Math.round(parseFloat($("f-fee").value) * 10);
        if (!(cash > 0)) return toast("현금 환율을 숫자로 적어주세요");
        if (!(fee >= 0)) fee = d.fee;
      }
      applyTrip(id, name, cash, fee);
      return go("invite");
    }
    case "copy-link": return copy(`https://hashell.app/j/${S.trip.code}`, "초대 링크를 복사했어요");
    case "lock":
      S.sheet = { html: `<p class="q" id="sheet-q">링크를 잠글까요?</p><p class="hint">이미 참여한 사람은 계속 쓸 수 있어요. 아직 안 들어온 ${S.members.filter(m => !m.bound).map(m => esc(m.name)).join(", ") || "사람"}님은 더 들어올 수 없어요.</p>`, ok: "잠그기", act: "lock-confirm" };
      return renderOverlay();
    case "lock-confirm": S.status = "LOCKED"; S.sheet = null; render(); return toast("링크를 잠갔어요");
    case "sheet-close": {
      const sc = $("overlay").querySelector(".scrim");
      if (!sc || sc.classList.contains("out")) return;
      sc.classList.add("out");
      return setTimeout(() => { S.sheet = null; renderOverlay(); }, 200);
    }
    case "pick": S.pick = p; { const f = $("f-new"); if (f) f.value = ""; } return render();
    case "join-confirm": {
      const nv = ($("f-new") || {}).value?.trim();
      if (nv) {
        if (S.members.some(m => m.name === nv)) return toast("이미 있는 이름이에요. 목록에서 골라주세요.");
        const id = "n" + Date.now();
        S.members.push({ id, name: nv, bound: true });
        S.viewer = id;
      } else if (S.pick) { mem(S.pick).bound = true; S.viewer = S.pick; }
      else return toast("이름을 골라주세요");
      S.pick = null;
      go("home");
      return toast(`${me().name}님으로 참여했어요`);
    }
    case "toggle": {
      if (settled()) return toast("정산이 확정돼서 바꿀 수 없어요");
      const i = exp().items[+p], k = i.eat.indexOf(q);
      if (q !== S.viewer && !isOrg()) return toast("다른 사람 체크는 총무만 바꿀 수 있어요");
      if (k >= 0 && i.eat.length === 1) return toast("한 명은 먹었어야 해요. 마지막 한 명은 뺄 수 없어요");
      const before = sharesOf(exp()).krw[S.viewer] || 0;
      if (k >= 0) i.eat.splice(k, 1); else i.eat = sorted([...i.eat, q]);
      const sc = $("screen").scrollTop;
      render();
      $("screen").scrollTop = sc;
      const chip = document.querySelector(`[data-act="toggle:${p}:${q}"]`);
      if (chip) chip.classList.add("pop");
      if ((sharesOf(exp()).krw[S.viewer] || 0) !== before) { const m = $("mine"); m.classList.remove("flash"); void m.offsetWidth; m.classList.add("flash"); }
      return;
    }
    case "est-info": { const b = $("estbox"); if (b) b.hidden = !b.hidden; return; }
    case "payer": case "pay": {
      S.draft[a] = p;
      const n = $("f-shop")?.value, amt = $("f-amt")?.value;
      render();
      if (n != null) $("f-shop").value = n;
      if (amt != null && $("f-amt")) $("f-amt").value = amt;
      return;
    }
    case "save-review": {
      const P = D().parsed, id = "x" + Date.now();
      S.expenses.push({ id, name: $("f-shop").value.trim() || P.name, orig: P.orig, day: P.day, payer: S.draft.payer, pay: S.draft.pay,
        items: P.items.map(i => ({ ...i, eat: order() })) });
      S.draft = null; S.expId = id; S.stagger = true;
      go("check");
      return toast("저장했어요. 안 먹은 메뉴에서 이름을 빼주세요");
    }
    case "save-manual": {
      const n = $("f-shop").value.trim(), y = parseInt($("f-amt").value, 10);
      if (!n) return toast("어디서 썼는지 적어주세요");
      if (!(y > 0)) return toast(`총액을 ${S.trip.cur.unit} 단위 숫자로 적어주세요`);
      S.expenses.push({ id: "m" + Date.now(), name: n, orig: "", day: Math.max(0, S.trip.days.length - 1), payer: S.draft.payer, pay: S.draft.pay,
        items: [{ o: "", k: "전체 금액", u: y, q: 1, cat: "meal", eat: order() }] });
      S.draft = null;
      go("home");
      return toast("저장했어요");
    }
    case "settle-confirm": S.status = "SETTLED"; S.frozen = transfers(); S.recv = {}; go("settled"); return toast("정산을 확정했어요");
    case "recv": S.recv[p] = true; return render();
    case "copy-xfer": { const x = S.frozen[+p]; return copy(`${mem(x.to).name}님께 ${won(x.amt)}`, "보낼 금액을 복사했어요"); }
    case "unsettle":
      S.sheet = { html: `<p class="q" id="sheet-q">확정을 해제할까요?</p><p class="hint">송금 목록과 ‘받았어요’ 표시가 모두 지워져요. 다시 체크를 고친 뒤 확정할 수 있어요.</p>`, ok: "해제하기", act: "unsettle-confirm", danger: true };
      return renderOverlay();
    case "unsettle-confirm": S.status = "LOCKED"; S.frozen = null; S.recv = {}; go("settle"); return toast("확정을 해제했어요");
    case "wrapped": return openWrapped();
    case "wr-close": return closeWrapped();
    case "wr-replay": if (S.slide) { S.slide = 1; wrStep(-1); } return;
    case "wr-copy": return copy(S.wrSummary, "여행 돌아보기를 복사했어요");
  }
});
document.addEventListener("keydown", e => {
  if (!S.wrapped) { if (e.key === "Escape" && S.sheet) { S.sheet = null; renderOverlay(); } return; }
  if (e.key === "ArrowRight") wrStep(1);
  if (e.key === "ArrowLeft") wrStep(-1);
  if (e.key === "Escape") closeWrapped();
});

/* ---------- 시작 ---------- */
(function boot() {
  const h = location.hash.slice(1);
  if (h === "wrapped") { forceSettled(); S.route = "home"; render(); openWrapped(); }
  else {
    if (h === "settled") forceSettled();
    if (h === "join") S.viewer = "mj";
    go(V[h] ? h : "create");
  }
  S.lastPreview = previewId();
  // 데이터베이스: 여행지 목록을 구독한다. 10초 안에 답이 없으면 기본 예시로 둔다
  const giveUp = setTimeout(() => { if (dbState === "loading") { dbState = "off"; renderPanel(); } }, 10000);
  Promise.resolve(window.claude?.use?.("db")).then(db => {
    if (!db) { clearTimeout(giveUp); dbState = "off"; renderPanel(); return; }
    db.collection("destinations").onSnapshot(snap => {
      clearTimeout(giveUp);
      const next = {};
      snap.docs.forEach(doc => { const d = cleanDest(doc.data()); if (d) next[doc.id] = d; });
      if (!Object.keys(next).length) { dbState = "off"; renderPanel(); return; }
      DESTS = next;
      if (!DESTS.osaka) DESTS.osaka = FALLBACK;
      dbState = "ok";
      S.lastPreview = previewId();
      // 아직 아무것도 바꾸지 않은 첫 상태면 데이터베이스 내용으로 다시 채운다
      if (S.route === "create" && !S.touched) S.expenses = clone(destOf(S.trip.dest).expenses);
      render();
    }, () => { clearTimeout(giveUp); dbState = "off"; renderPanel(); });
  }, () => { clearTimeout(giveUp); dbState = "off"; renderPanel(); });
})();
</script>
